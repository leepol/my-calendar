name: Build Calendar EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 requests pyinstaller google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --collect-all googleapiclient --collect-all google_auth_oauthlib calendar_widget.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Calendar-App
        path: dist/calendar_widget.exe
